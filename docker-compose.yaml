name: chatterbox

services:
  backend:
    build: ./backend
    container_name: chatterbox-backend
    environment:
      CHAT_DATABASE_URL: /app/data/database.db
      CHAT_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - chat-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: chatterbox-frontend
    environment:
      BUN_PUBLIC_API_BASE: http://localhost:8000/api
      BUN_PUBLIC_WS_BASE: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chat-data: